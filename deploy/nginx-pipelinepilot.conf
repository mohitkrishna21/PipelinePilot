# Nginx site config for PipelinePilot, proxying to the Docker container
# listening on 127.0.0.1:8001 (see Dockerfile - EXPOSE 8001).
#
# Plain HTTP only on purpose: run `sudo certbot --nginx -d <your-subdomain>`
# after this is in place and enabled, same as was done for HybridRAG.
# Certbot edits this file in place to add the SSL block (listen 443, the
# cert paths, HTTP/2) and inserts the HTTP -> HTTPS redirect for you - don't
# hand-add SSL directives here first, that just gives Certbot more to merge
# around and makes the diff harder to read later.

server {
    listen 80;
    listen [::]:80;
    server_name pipelinepilot.mohitkrishna.dev;

    # Matches the app's own 20KB request-body cap (web/config.py
    # max_body_bytes) - stop oversized bodies at the proxy, not just the app.
    client_max_body_size 20k;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the /chat SSE stream to actually stream: Nginx
        # buffers upstream responses by default, which would hold back
        # every SSE event until the whole response closed - defeating the
        # whole point of streaming. The app already sends
        # X-Accel-Buffering: no on that response, but proxy_buffering off
        # here is the Nginx-side half of the same fix, and covers every
        # route through this block, not just the one the app remembered
        # to set the header on.
        proxy_buffering off;

        # SSE connections sit open for the life of a turn (up to
        # turn_timeout_seconds in web/config.py). Nginx's default proxy
        # read timeout (60s) would silently kill a slow turn partway
        # through - set this comfortably above whatever that timeout is.
        proxy_read_timeout 180s;
    }
}
